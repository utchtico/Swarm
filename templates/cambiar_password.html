<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Cambiar contraseña — Swarm</title>
</head>

<body>
    <main class="login-bg">
        <section class="login-section">
            <h2>Cambiar contraseña</h2>
            <p style="text-align:center;color:#6b7280;font-size:0.875rem;margin-bottom:1.2rem;">
                Tu cuenta tiene una contraseña temporal.<br>
                Por favor elige una nueva para continuar.
            </p>
            {% if msg %}
            <div class="login-error" role="alert"
                style="{% if not error %}background:#d1fae5;color:#065f46;border-color:#6ee7b7;{% endif %}">
                {{ msg }}
            </div>
            {% endif %}
            <form action="{{ url_for('auth.cambiar_password') }}" method="POST" class="login-form" autocomplete="off">
                <input class="login-input" type="password" name="nueva_password"
                    placeholder="Nueva contraseña (mínimo 8 caracteres)" aria-label="Nueva contraseña" minlength="8"
                    required>
                <input class="login-input" type="password" name="confirmar_password"
                    placeholder="Confirmar nueva contraseña" aria-label="Confirmar contraseña" minlength="8" required>
                <button class="login-btn" type="submit">Guardar contraseña</button>
            </form>
        </section>
    </main>
</body>

</html>
