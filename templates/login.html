<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Login</title>
</head>

<body>
    <main class="login-bg">
        <section class="login-section">
            <h2>Iniciar sesión</h2>
            {% if msg %}
            <div class="login-error" role="alert">{{ msg }}</div>
            {% endif %}
            <form action="{{ url_for('auth.login') }}" method="POST" class="login-form" autocomplete="on">
                <input class="login-input" type="text" id="username" name="username" placeholder="Usuario"
                    aria-label="Usuario" autocomplete="username" required value="{{ request.form.username or '' }}">
                <input class="login-input" type="password" id="password" name="password" placeholder="Contraseña"
                    aria-label="Contraseña" autocomplete="current-password" required>
                <button class="login-btn" type="submit">Ingresar</button>
            </form>
            <p class="login-bottom-text" style="color:#9ca3af;font-size:0.8rem;">
                El acceso es solo por invitación.
                Contacta al administrador si necesitas una cuenta.
            </p>
        </section>
    </main>
</body>

</html>
